<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spatial Browser Source Fixture</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; font-family: system-ui, sans-serif; }
    body { min-height: 1800px; padding: 56px; background: #f8fafc; color: #0f172a; }
    body::before, body::after, main::before, main::after {
      content: ""; position: fixed; width: 72px; height: 72px; z-index: 20;
    }
    body::before { left: 0; top: 0; background: rgb(255, 0, 0); }
    body::after { right: 0; top: 0; background: rgb(0, 255, 0); }
    main::before { left: 0; bottom: 0; background: rgb(0, 0, 255); }
    main::after { right: 0; bottom: 0; background: rgb(255, 255, 0); }
    main { max-width: 760px; margin: auto; }
    input, button, a { font: inherit; padding: 12px 14px; }
    #button { position: absolute; left: 100px; top: 180px; width: 200px; height: 64px; }
    label { position: absolute; left: 100px; top: 270px; }
    #input { width: 260px; }
    #link { position: absolute; left: 100px; top: 370px; width: 220px; height: 52px; }
    #status { position: absolute; left: 100px; top: 450px; }
    #scroll-target { margin-top: 1200px; padding: 24px; background: #dbeafe; }
  </style>
</head>
<body>
  <main>
    <h1>Spatial browser input fixture</h1>
    <p>The fixed red/green/blue/yellow corners expose bitmap channel-order or vertical-orientation mistakes.</p>
    <button id="button" type="button">Click target</button>
    <label>Type here <input id="input" autocomplete="off" /></label>
    <a id="link" href="?navigated=1">Navigation target</a>
    <output id="status">idle</output>
    <div id="scroll-target">Scroll target</div>
  </main>
  <script>
    const status = document.getElementById('status');
    document.getElementById('button').addEventListener('click', () => { status.value = 'clicked'; });
    document.getElementById('input').addEventListener('input', (event) => { status.value = event.target.value; });
    window.addEventListener('scroll', () => { document.documentElement.dataset.scrollY = String(window.scrollY); });
  </script>
</body>
</html>
